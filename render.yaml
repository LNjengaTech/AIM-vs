# render.yaml
# Render deployment config for the AIM-Mombasa Socket.io server.
# Render reads this file automatically when you connect the repo.

services:
  - type: web
    name: aim-mombasa-socket
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npm run start:socket
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false